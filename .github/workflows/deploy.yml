name: Deploy to EC2

on:

  push:

    branches:

      - main

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout code

      uses: actions/checkout@v3

    - name: Deploy via SSH

      uses: appleboy/ssh-action@v1.0.3

      with:

        host: ${{ secrets.DARSHAN }}

        username: ubuntu

        key: ${{ secrets.EC2_SSH_KEY }}

        script: |
          cd /home/ubuntu
          git clone https://github.com/Darshan2530/demo22.git app || (cd app && git pull origin main)
          cd app
          sudo docker build -t my-app .
          sudo docker stop my-app-container || true
          sudo docker rm my-app-container || true
          sudo docker run -d --name my-app-container -p 80:80 my-app
          echo "Deployment completed successfully!"