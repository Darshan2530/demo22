<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MyShop – E-Commerce</title>

<style>
/* ---------- CSS ---------- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f4f4;
}

/* HEADER */
header {
    background: #222;
    color: #fff;
    padding: 15px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header nav a {
    color: #fff;
    margin-left: 20px;
    text-decoration: none;
}

.cart-count {
    background: orange;
    padding: 3px 8px;
    border-radius: 50%;
    font-size: 14px;
}

/* HERO */
.hero {
    background: #ff9800;
    color: #fff;
    text-align: center;
    padding: 60px 20px;
}

/* PRODUCTS */
.products {
    padding: 40px;
}

.products h2 {
    text-align: center;
    margin-bottom: 30px;
}

.product-grid {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
}

.product-card {
    background: #fff;
    padding: 20px;
    width: 220px;
    text-align: center;
    border-radius: 6px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.product-card img {
    width: 100%;
    margin-bottom: 10px;
}

.product-card button {
    margin-top: 10px;
    padding: 8px 15px;
    background: #ff9800;
    border: none;
    color: #fff;
    cursor: pointer;
}

.product-card button:hover {
    background: #e68900;
}

/* CART */
.cart {
    background: #fff;
    padding: 30px;
    margin: 40px;
    border-radius: 6px;
}

.cart h2 {
    margin-bottom: 15px;
}

.cart ul {
    list-style: none;
}

.cart li {
    margin-bottom: 8px;
}

/* FOOTER */
footer {
    background: #222;
    color: #fff;
    text-align: center;
    padding: 15px;
    margin-top: 40px;
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
    <h1>MyShop</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Cart <span class="cart-count" id="cartCount">0</span></a>
    </nav>
</header>

<!-- HERO -->
<section class="hero">
    <h2>Welcome to MyShop</h2>
    <p>Simple E-Commerce Website</p>
</section>

<!-- PRODUCTS -->
<section class="products">
    <h2>Products</h2>

    <div class="product-grid">
        <div class="product-card">
            <img src="https://via.placeholder.com/200">
            <h3>Smart Watch</h3>
            <p>₹1999</p>
            <button onclick="addToCart('Smart Watch')">Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/200">
            <h3>Headphones</h3>
            <p>₹1499</p>
            <button onclick="addToCart('Headphones')">Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/200">
            <h3>Mobile Phone</h3>
            <p>₹9999</p>
            <button onclick="addToCart('Mobile Phone')">Add to Cart</button>
        </div>
    </div>
</section>

<!-- CART -->
<section class="cart">
    <h2>Your Cart</h2>
    <ul id="cartItems"></ul>
</section>

<!-- FOOTER -->
<footer>
    <p>© 2026 MyShop</p>
</footer>

<!-- ---------- JAVASCRIPT ---------- -->
<script>
let cart = [];

function addToCart(product) {
    cart.push(product);

    document.getElementById("cartCount").innerText = cart.length;

    let cartList = document.getElementById("cartItems");
    cartList.innerHTML = "";

    cart.forEach((item, index) => {
        let li = document.createElement("li");
        li.textContent = (index + 1) + ". " + item;
        cartList.appendChild(li);
    });
}
</script>

</body>
</html>
